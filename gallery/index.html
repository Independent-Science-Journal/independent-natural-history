
<!DOCTYPE html>
<html lang="ja">

<head>
  <script src="../js/gallery.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>写真帖 | 私設博物誌</title>

  <!-- サイト共通のデザイン -->
  <link rel="stylesheet" href="../style.css">

  <!-- 写真帖専用のデザイン -->
  <link rel="stylesheet" href="../css/gallery.css">
</head>

<body>

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="site-brand">
        <span class="brand-ja">私設博物誌</span>
        <span class="brand-en">
          Independent Natural History
        </span>
      </a>

      <nav class="site-nav" aria-label="メインメニュー">
        <a href="../collections/">蒐集</a>
        <a href="../records/">記録</a>
        <a href="../instruments/">装置</a>
        <a href="./" aria-current="page">写真帖</a>
        <a href="../index.html#souvenirs">おみやげ</a>
      </nav>

    </div>
  </header>


  <!-- ===== 写真帖 ===== -->
  <main class="gallery-page">

    <!-- パンくずリスト -->
    <nav class="breadcrumb" aria-label="現在位置">
      <a href="../index.html">トップ</a>
      / 写真帖
    </nav>

    <!-- ページの見出し -->
    <div class="gallery-intro">
      <h1>写真帖</h1>

      <p class="gallery-en">
        Photographic Album
      </p>

       <p>
    このページは、写真を公開することに
    全力を注いだ場所です。
  </p>

  <p>
    その名のとおり、写真を公開しています。
    写真のための写真帖です。
  </p>

  <p>写真のための写真帖です。</p>

  <p>大事なことなので、二度言いました。</p>
    </div>

<!-- ===== 写真の絞り込み・検索 ===== -->
<div class="gallery-controls">

  <!-- ジャンル選択 -->
  <label>
    ジャンル
    <select id="gallery-category">
      <option value="all">すべて</option>
      <option value="nature">自然</option>
      <option value="minerals">鉱物</option>
      <option value="history">歴史</option>
      <option value="astronomy">天体</option>
    </select>
  </label>

  <!-- キーワード検索 -->
  <label>
    写真を検索
    <input
      type="search"
      id="gallery-search"
      placeholder="名前・タグで検索">
  </label>

</div>

<!-- 該当する写真がない場合 -->
<p id="gallery-empty" hidden>
  該当する写真はありません。
</p>

    
<!-- ===== 写真一覧 ===== -->
<div class="gallery-grid">

  <!-- 1枚目：カマエカズラ -->
  <button type="button" class="gallery-item">
    <figure>
      <img
        src="../images/gallery/nature/IMG_7898.jpeg"
        alt="カマエカズラ"
        loading="lazy">

      <figcaption>カマエカズラ</figcaption>
    </figure>
  </button>

  <!-- 2枚目：弥生土器（画像名は仮） -->
  <button type="button" class="gallery-item">
    <figure>
      <img
        src="../images/gallery/history/cachedImage 2.png"
        alt="弥生土器"
        loading="lazy">

      <figcaption>弥生土器</figcaption>
    </figure>
  </button>

</div>

<!-- ===== 全写真共通の拡大画面 ===== -->
<dialog id="photo-dialog" class="gallery-dialog">

  <form method="dialog">
    <button type="submit" class="gallery-close">
      × 閉じる
    </button>
  </form>

  <!-- JavaScriptが写真をここへ読み込む -->
  <img id="photo-dialog-image" alt="">

</dialog>



     
  </main>

</body>
</html>
