<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- サイト名 -->
<title>私設博物誌 | Independent Natural History</title>

<!-- 検索エンジン向けのサイト説明 -->
<meta name="description"
      content="私設博物誌は、個人による科学研究、実験記録、自作装置、鉱物標本、歴史資料などを収集・整理し、公開する独立したアーカイブです。">

  <!-- デザイン -->
  <link rel="stylesheet" href="./style.css">

  <!-- サイトの情報と動作 -->
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="./" class="site-brand">
        <span class="brand-jp">私設博物誌</span>
        <span class="brand-en">Independent Natural History</span>
      </a>
      <nav class="site-nav" aria-label="メインメニュー">
        <a href="collections/">蒐集</a>
        <a href="records/">記録</a>
        <a href="instruments/">装置</a>
        <a href="#souvenirs">おみやげ</a>
      </nav>
    </div>
  </header>
  
<section class="inh-hero">
  <img src="./images/top/hero1.jpg" class="active" alt="写真1">
  <img src="./images/top/IMG_1539.jpeg" alt="写真2">
  <img src="./images/top/IMG_2410.jpeg" alt="写真3">
  <img src="./images/top/10.jpeg" alt="写真3">
</section>

<script>
(() => {
  const slides = document.querySelectorAll(".inh-hero img");
  if (slides.length < 2) return;

  let current = 0;

  setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
  }, 6000);
})();
</script>

  <main id="app">
    <section id="collections">
      <h2>蒐集 / collections</h2>
      <p>蒐集したものを後悔しています</p>

      <a href="collections/">蒐集物を見る →</a>
      
    </section>

    <section id="records">
      <h2>記録 / records</h2>
      <p>実験 観察　調査　計算などの記録を公開しています</p>
　　　　<a href="records/">記録を見る →</a>
   
    </section>

    <section id="instruments">
      <h2>装置 / instruments</h2>
      <p>自作装置の設計、設計過程、実験結果公開しています。</p>
      <a href="instruments/">装置を見る →</a>

    </section>

    <section id="souvenirs">
      <h2>おみやげ / souvenirs</h2>
      <p>個人で制作したハンドメイド品などを紹介、販売しています</p>
      <span>準備中</span>
    </section>

  </main>
  <footer>館主:微粒 界</footer>
 
 
</body>
</html>
