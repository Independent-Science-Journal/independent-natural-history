<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>私設博物誌</title>

  <!-- デザイン -->
  <link rel="stylesheet" href="./style.css">

  <!-- サイトの情報と動作 -->
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="./" class="site-brand">
        <span class="brand-jp">私設博物誌</span>
        <span class="brand-en">Independent Natural History</span>
      </a>
      <nav class="site-nav" aria-label="メインメニュー">
        <a href="#collections">蒐集</a>
        <a href="#records">記録</a>
        <a href="#instruments">装置</a>
        <a href="#souvenirs">おみやげ</a>
      </nav>
    </div>
  </header>
  
<section class="inh-hero">
  <img src="./images/top/hero1.jpg" class="active" alt="写真1">
  <img src="./images/top/IMG_1539.jpeg" alt="写真2">
  <img src="./images/top/IMG_2382.jpeg" alt="写真3">
  <img src="./images/top/IMG_0877.jpeg" alt="写真3">
</section>

<script>
(() => {
  const slides = document.querySelectorAll(".inh-hero img");
  if (slides.length < 2) return;

  let current = 0;

  setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
  }, 6000);
})();
</script>

  <main id="app">
    <section id="collections">
      <h2>蒐集</h2>
    </section>

    <section id="records">
      <h2>記録</h2>
      <a href="records/computational-chemistry/first-md.html">
        初めての分子運動シュミレーション
      </a>

      <p> 計算化学 / PC性能試験 / 2026年11月3日
      </p>
      
    </section>

    <section id="instruments">
      <h2>装置</h2>
    </section>

    <section id="souvenirs">
      <h2>おみやげ</h2>
    </section>

  </main>
 
 
</body>
</html>
